<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Daniel Mroczek's portfolio</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.16.2/dist/module.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <nav class="container">
        <ul>
          <li><h1>Daniel Mroczek: portfolio</h1></li>
        </ul>
        <ul>
          <li>
            <a href="https://github.com/danielmroczek" aria-label="GitHub profile" target="_blank" rel="noopener"></a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="container" x-data="projects">
      <p x-show="loading" x-cloak>Loading…</p>

      <nav class="tag-bar" x-show="!loading" x-cloak aria-label="Filter projects by tag">
        <button :class="activeTag !== null && 'secondary'" @click="setActiveTag(null)">All</button>
        <template x-for="tag in filterableTags" :key="tag">
          <button :class="activeTag !== tag && 'secondary'" @click="setActiveTag(tag)" x-text="tag"></button>
        </template>
      </nav>

      <section class="grid" x-show="!loading" x-cloak>
        <template x-for="project in filteredProjects" :key="project.href">
          <a class="project-link" :href="project.href">
            <article>
              <div class="thumb">
                <img :src="project.image" :alt="project.imageAlt" />
                <h3 x-text="project.title"></h3>
              </div>
              <p x-text="project.description"></p>
            </article>
          </a>
        </template>
      </section>
    </main>

    <footer class="container">
      <p>© 2026 Daniel Mroczek</p>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
