<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Daniel Mroczek's portfolio</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.16.2/dist/module.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <nav class="container">
        <h1>Daniel Mroczek: portfolio</h1>
        <a href="https://github.com/danielmroczek" aria-label="GitHub profile" target="_blank" rel="noopener">
          <img class="github-icon github-icon--light" src="https://cdn.simpleicons.org/github/181717" alt="GitHub" width="24" height="24" />
          <img class="github-icon github-icon--dark" src="https://cdn.simpleicons.org/github/ffffff" alt="GitHub" width="24" height="24" />
        </a>
      </nav>
    </header>

    <main class="container" x-data="projects">
      <p x-show="loading" x-cloak>Loading…</p>

      <nav class="tag-bar" x-show="!loading" x-cloak aria-label="Filter projects by tag">
        <button :class="activeTag !== null && 'secondary outline'" @click="setActiveTag(null)">All</button>
        <template x-for="tag in filterableTags" :key="tag">
          <button :class="activeTag !== tag && 'secondary outline'" @click="setActiveTag(tag)" x-text="tag"></button>
        </template>
      </nav>

      <section class="grid" x-show="!loading" x-cloak>
        <template x-for="project in filteredProjects" :key="project.href">
          <a class="project-link" :href="project.href">
            <article>
              <div class="thumb"
                   :style="project.gradientCSS ? { background: project.gradientCSS } : {}"
                   :class="{ 'thumb--fallback': !project.gradientCSS }">
                <template x-if="project.iconSvg">
                  <svg class="thumb__icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"
                       x-html="project.iconSvg"></svg>
                </template>
                <template x-if="!project.iconSvg && !project.gradientCSS">
                  <span class="thumb__letter" x-text="project.title?.[0] || '?'"></span>
                </template>
              </div>
              <div class="project-body">
                <h3 x-text="project.title"></h3>
                <p x-text="project.description"></p>
              </div>
            </article>
          </a>
        </template>
      </section>
    </main>

    <footer class="container">
      <p>© 2026 Daniel Mroczek</p>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
